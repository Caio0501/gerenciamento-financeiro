<div class="company-list-container">
  <div class="header">
    <div class="titles">
      <h2>Empresas</h2>
      <p class="subtitle">Gerencie suas empresas e organizações</p>
    </div>
    <button mat-raised-button color="primary" (click)="openDialog()">
      <mat-icon>add</mat-icon> Nova Empresa
    </button>
  </div>

  <div class="table-container">
    <table mat-table [dataSource]="companies" class="data-table">
      <!-- Nome Column -->
      <ng-container matColumnDef="nome">
        <th mat-header-cell *matHeaderCellDef> Nome </th>
        <td mat-cell *matCellDef="let element">
          <div class="company-cell">
            <div class="avatar-box">
              <mat-icon>business</mat-icon>
            </div>
            <span>{{element.nome}}</span>
          </div>
        </td>
      </ng-container>

      <ng-container matColumnDef="descricao">
        <th mat-header-cell *matHeaderCellDef> Descrição </th>
        <td mat-cell *matCellDef="let element"> {{ element.descricao || '-' }} </td>
      </ng-container>

      <!-- Criada em Column -->
      <ng-container matColumnDef="dataCriacao">
        <th mat-header-cell *matHeaderCellDef> Criada em </th>
        <td mat-cell *matCellDef="let element"> {{ element.dataCriacao | date:'dd/MM/yyyy' }} </td>
      </ng-container>

      <!-- Status Column (Mock) -->
      <ng-container matColumnDef="status">
        <th mat-header-cell *matHeaderCellDef> Status </th>
        <td mat-cell *matCellDef="let element"> 
          <span class="status-badge">Ativa</span>
        </td>
      </ng-container>

      <!-- Actions Column -->
      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef> Ações </th>
        <td mat-cell *matCellDef="let element">
          <div class="actions-cell">
            <button mat-icon-button (click)="openDialog(element)">
              <mat-icon class="edit-icon">edit</mat-icon>
            </button>
            <button mat-icon-button color="warn" (click)="deleteCompany(element)">
              <mat-icon class="delete-icon">delete_outline</mat-icon>
            </button>
          </div>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

      <tr class="mat-row" *matNoDataRow>
        <td class="mat-cell empty-state-cell" colspan="5">
          <div class="empty-state-content">
            <mat-icon>business</mat-icon>
            <p class="empty-title">Nenhuma empresa cadastrada</p>
            <p class="empty-subtitle">Clique em "Nova Empresa" para começar</p>
          </div>
        </td>
      </tr>
    </table>
  </div>
</div>
