<div class="page-container">
  <div class="header">
    <div class="titles">
      <h2>Tipos de Receita</h2>
      <p class="subtitle">Gerencie os tipos de receita</p>
    </div>
    <button mat-raised-button color="primary" (click)="openDialog()">
      <mat-icon>add</mat-icon> Novo Tipo
    </button>
  </div>

  <div class="table-container">
    <table mat-table [dataSource]="revenueTypes" class="data-table">
      <ng-container matColumnDef="cor">
        <th mat-header-cell *matHeaderCellDef> Cor </th>
        <td mat-cell *matCellDef="let element">
          <div class="color-indicator" [style.background-color]="element.cor || '#757575'"></div>
        </td>
      </ng-container>

      <!-- Nome Column -->
      <ng-container matColumnDef="nome">
        <th mat-header-cell *matHeaderCellDef> Nome </th>
        <td mat-cell *matCellDef="let element"> {{ element.nome }} </td>
      </ng-container>

      <!-- Actions Column -->
      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef> Ações </th>
        <td mat-cell *matCellDef="let element">
          <div class="actions-cell">
            <button mat-icon-button (click)="openDialog(element)">
              <mat-icon class="edit-icon">edit</mat-icon>
            </button>
            <button mat-icon-button color="warn" (click)="delete(element)">
              <mat-icon class="delete-icon">delete_outline</mat-icon>
            </button>
          </div>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

      <tr class="mat-row" *matNoDataRow>
        <td class="mat-cell empty-state-cell" colspan="3">
          <div class="empty-state-content">
            <mat-icon>trending_up</mat-icon>
            <p class="empty-title">Nenhum tipo de receita cadastrado</p>
            <p class="empty-subtitle">Clique em "Novo Tipo" para começar</p>
          </div>
        </td>
      </tr>
    </table>
  </div>
</div>
