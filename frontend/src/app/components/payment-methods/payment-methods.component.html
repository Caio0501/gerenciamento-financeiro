<div class="page-container">
  <div class="header">
    <div class="titles">
      <h2>Formas de Pagamento</h2>
      <p class="subtitle">Gerencie as formas de pagamento disponíveis</p>
    </div>
    <button mat-raised-button color="primary" (click)="openDialog()">
      <mat-icon>add</mat-icon> Nova Forma
    </button>
  </div>

  <div class="table-container">
    <table mat-table [dataSource]="paymentMethods" class="data-table">
      <ng-container matColumnDef="icon">
        <th mat-header-cell *matHeaderCellDef> Ícone </th>
        <td mat-cell *matCellDef="let element">
          <div class="icon-cell">
            <span *ngIf="element.icone; else defaultIcon">{{ element.icone }}</span>
            <ng-template #defaultIcon>
              <mat-icon>payment</mat-icon>
            </ng-template>
          </div>
        </td>
      </ng-container>

      <!-- Nome Column -->
      <ng-container matColumnDef="nome">
        <th mat-header-cell *matHeaderCellDef> Nome </th>
        <td mat-cell *matCellDef="let element"> {{ element.nome }} </td>
      </ng-container>

      <!-- Actions Column -->
      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef> Ações </th>
        <td mat-cell *matCellDef="let element">
          <div class="actions-cell">
            <button mat-icon-button (click)="openDialog(element)">
              <mat-icon class="edit-icon">edit</mat-icon>
            </button>
            <button mat-icon-button color="warn" (click)="delete(element)">
              <mat-icon class="delete-icon">delete_outline</mat-icon>
            </button>
          </div>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

      <tr class="mat-row" *matNoDataRow>
        <td class="mat-cell empty-state-cell" colspan="3">
          <div class="empty-state-content">
            <mat-icon>payment</mat-icon>
            <p class="empty-title">Nenhuma forma de pagamento cadastrada</p>
            <p class="empty-subtitle">Clique em "Nova Forma" para começar</p>
          </div>
        </td>
      </tr>
    </table>
  </div>
</div>
